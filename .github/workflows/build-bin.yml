name: Build wb2api linux‑arm64 binary
on:
  workflow_dispatch: # 手动点按钮触发编译（最常用）
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * *" # 每天早上5点自动拉上游编译

jobs:
  compile:
    runs-on: ubuntu‑latest
    steps:
      - name: 拉取上游仓库最新main源码
        uses: actions/checkout@v4
        with:
          repository: misakano7545/workbuddy2api‑panel
          ref: main
          fetch‑depth: 0

      - name: 安装Go环境
        uses: actions/setup‑go@v5
        with:
          go‑version: "1.23"

      - name: 交叉编译 linux‑arm64 静态二进制
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build ‑trimpath ‑ldflags "-s ‑w" ‑o wb2api‑arm64 ./cmd/server
          ls ‑lh wb2api‑arm64

      - name: 上传编译产物
        uses: actions/upload‑artifact@v4
        with:
          name: wb2api‑linux‑arm64
          path: wb2api‑arm64
